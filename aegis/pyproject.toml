[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-security"
version = "0.1.0"
description = "AI-powered autonomous application security scanner"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "pydantic",
    "docker"
]

[project.scripts]
aegis = "aegis.cli:app"